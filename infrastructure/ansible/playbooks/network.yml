- name: Configure Gateway
  hosts: gateways
  become: true

  vars:
    private_subnet: "192.168.57.0/24"
    wan_interface: "eth0"
    lan_interface: "eth1"

  tasks:
    - name: Install networking packages
      ansible.builtin.apt:
        name:
          - ufw
          - iptables-persistent
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Configure NAT masquerading
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ private_subnet }}"
        out_interface: "{{ wan_interface }}"
        jump: MASQUERADE
        state: present

    - name: Save persistent iptables rules
      ansible.builtin.command:
        cmd: netfilter-persistent save
      changed_when: false

    - name: Allow SSH from Vagrant NAT
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        interface: eth0
        direction: in

    - name: Allow SSH from host machine
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: 192.168.56.1

    - name: Allow forwarding from private network to NAT
      community.general.ufw:
        rule: allow
        route: true
        interface_in: "{{ lan_interface }}"
        interface_out: "{{ wan_interface }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

- name: Configure APP servers
  hosts: apps
  become: true

  vars:
    gateway_private_ip: "192.168.57.2"

  tasks:
    - name: Install networking packages
      ansible.builtin.apt:
        name:
          - ufw
        state: present
        update_cache: true

    - name: Allow SSH through Vagrant NAT
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        interface: eth0
        direction: in

    - name: Allow SSH from Gateway
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ gateway_private_ip }}"

    - name: Allow application traffic from Gateway
      community.general.ufw:
        rule: allow
        port: "8000"
        proto: tcp
        src: "{{ gateway_private_ip }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Inspect existing Netplan configuration
      ansible.builtin.command:
        cmd: ls -1 /etc/netplan
      register: netplan_files
      changed_when: false

    - name: Display existing Netplan files
      ansible.builtin.debug:
        var: netplan_files.stdout_lines