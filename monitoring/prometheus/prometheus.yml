global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: linux_nodes
    static_configs:
      - targets:
          - "192.168.57.2:9100"
          - "192.168.57.11:9100"
          - "192.168.57.12:9100"
          - "192.168.57.20:9100"
        labels:
          environment: homelab